[project]
name = "rag-document-qa"
version = "0.1.0"
description = "RAG-powered document Q&A system with hybrid retrieval (vector + BM25), ChromaDB, and Groq LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.3.0",
    "faiss-cpu>=1.12.0",
    "ipykernel>=7.1.0",
    "langchain>=1.0.3",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.2",
    "langchain-groq>=1.0.1",
    "langchain-text-splitters>=0.3.0",
    "numpy>=1.26.0",
    "pymupdf>=1.26.5",
    "pypdf>=6.1.3",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.40.0",
]
